<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">CoRE2026のEtherCAT構成</title>
  <desc id="desc">ROS 2からデーモン、EtherCAT、AX58100とTeensy 4.1を経由してCAN、シリアル、PWM機器へ接続する構成図</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .small { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #33475b; }
      .arrow-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0b638f; }
      .box { stroke: #243447; stroke-width: 2; rx: 12; }
      .line { stroke: #243447; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="title">CoRE2026のEtherCAT構成</text>

  <rect x="35" y="105" width="210" height="125" class="box" fill="#e7f4ff"/>
  <text x="140" y="150" text-anchor="middle" class="label">ROS 2</text>
  <text x="140" y="180" text-anchor="middle" class="small">core_hardware</text>
  <text x="140" y="205" text-anchor="middle" class="small">モーター・LED指令</text>

  <rect x="330" y="105" width="240" height="125" class="box" fill="#e7f4ff"/>
  <text x="450" y="145" text-anchor="middle" class="label">Daemon</text>
  <text x="450" y="177" text-anchor="middle" class="small">SOEMマスタ</text>
  <text x="450" y="202" text-anchor="middle" class="small">10 ms周期</text>

  <rect x="655" y="105" width="245" height="125" class="box" fill="#fff3d9"/>
  <text x="777" y="145" text-anchor="middle" class="label">上部基板</text>
  <text x="777" y="177" text-anchor="middle" class="small">AX58100 + Teensy 4.1</text>
  <text x="777" y="202" text-anchor="middle" class="small">SOESスレーブ</text>

  <rect x="985" y="78" width="180" height="64" class="box" fill="#e8f7e9"/>
  <text x="1075" y="106" text-anchor="middle" class="label">CAN</text>
  <text x="1075" y="129" text-anchor="middle" class="small">モーター・下部基板</text>
  <rect x="985" y="165" width="180" height="64" class="box" fill="#e8f7e9"/>
  <text x="1075" y="193" text-anchor="middle" class="label">Serial</text>
  <text x="1075" y="216" text-anchor="middle" class="small">サーボ・無線</text>
  <rect x="985" y="252" width="180" height="64" class="box" fill="#e8f7e9"/>
  <text x="1075" y="280" text-anchor="middle" class="label">PWM</text>
  <text x="1075" y="303" text-anchor="middle" class="small">発射用ESC</text>

  <path d="M245 167 L330 167" class="line"/>
  <text x="287" y="150" text-anchor="middle" class="arrow-label">IPC</text>
  <path d="M570 167 L655 167" class="line"/>
  <text x="612" y="150" text-anchor="middle" class="arrow-label">EtherCAT</text>
  <path d="M900 155 C940 155, 940 110, 985 110" class="line"/>
  <path d="M900 175 L985 197" class="line"/>
  <path d="M900 195 C940 195, 940 284, 985 284" class="line"/>

  <rect x="330" y="305" width="570" height="80" rx="10" fill="#f5f7f9" stroke="#9aa8b6" stroke-width="1.5"/>
  <text x="615" y="337" text-anchor="middle" class="small">RxPDO 71 B：モーター・システム・LED指令</text>
  <text x="615" y="367" text-anchor="middle" class="small">TxPDO 123 B：位置・速度・トルク・競技状態</text>
</svg>
