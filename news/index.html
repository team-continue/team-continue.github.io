<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NEWS｜チームこんてにゅ～</title>
<meta name="description" content="チームこんてにゅ～からのお知らせ一覧です。大会出場情報や活動状況などをお伝えします。">
<link rel="stylesheet" href="/styles.css">
</head>
<body bgcolor="#FFFFFF" text="#000000" link="#0000EE" vlink="#551A8B">
<table border="0" cellpadding="8" cellspacing="0" width="100%">
<tr>
{% include sidebar.html %}
<td valign="top">
<font face="ＭＳ Ｐゴシック">

<center><font size="6"><b>お知らせ一覧</b></font></center>
<hr size="2">
{% assign news_list = site.news | sort: "date" | reverse %}
<font size="3">
<table border="1" cellpadding="5" cellspacing="0">
<tr bgcolor="#CCCCFF"><td><b>日付</b></td><td><b>タイトル</b></td></tr>
{% for post in news_list %}
<tr><td>{{ post.date | date: "%Y.%m.%d" }}</td><td><a href="{{ post.url }}">{{ post.title }}</a></td></tr>
{% endfor %}
</table>
</font>
{% include footer.html %}
</font>
</td>
</tr>
</table>
</body>
</html>
